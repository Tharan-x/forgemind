# =============================================================================
# ForgeMind GitHub Actions — CI Pipeline
# Sprint 4: Lint, type-check, build, and 318-scenario integration test suite
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9.15.9'
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @forgemind/api db:generate

      - name: Run type check
        run: pnpm run type-check

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgemind
          POSTGRES_PASSWORD: forgemind_local_password
          POSTGRES_DB: forgemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgemind -d forgemind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: 'test'
      DATABASE_URL: 'postgresql://forgemind:forgemind_local_password@localhost:5432/forgemind'
      DIRECT_URL: 'postgresql://forgemind:forgemind_local_password@localhost:5432/forgemind'
      SUPABASE_URL: 'https://placeholder.supabase.co'
      SUPABASE_ANON_KEY: 'placeholder'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @forgemind/api db:generate

      - name: Push Database Schema
        run: pnpm --filter @forgemind/api db:push

      - name: Run API integration test suite
        run: pnpm --filter @forgemind/api test

      - name: Run Web integration test suite
        run: pnpm --filter @forgemind/web test

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check

    env:
      DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
      DIRECT_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
      SUPABASE_URL: 'https://placeholder.supabase.co'
      SUPABASE_ANON_KEY: 'placeholder'
      NEXT_PUBLIC_API_URL: 'http://localhost:4000'
      NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @forgemind/api db:generate

      - name: Build all packages
        run: pnpm run build
